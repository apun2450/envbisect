[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "envbisect"
version = "0.1.0"
description = "Find minimal failure-inducing environment variable changes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "EnvBisect contributors" }]
keywords = ["environment", "delta-debugging", "cli", "debugging"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/apun2450/envbisect"
Repository = "https://github.com/apun2450/envbisect"
Issues = "https://github.com/apun2450/envbisect/issues"
Documentation = "https://github.com/apun2450/envbisect/blob/main/docs/how-it-works.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
envbisect = "envbisect.cli:main"

[tool.setuptools.packages.find]
include = ["envbisect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["work", "outputs", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
