name: Bug report
description: Report a reproducible EnvBisect problem with sanitized details.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste secrets. Sanitize commands, environment snapshots, logs, and screenshots before submitting. For a vulnerability, use the private path in SECURITY.md.
  - type: input
    id: envbisect-version
    attributes:
      label: EnvBisect version
      placeholder: "0.1.0 (envbisect --version)"
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.12.5 (python --version)"
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: "Windows 11, macOS 15, Ubuntu 24.04, etc."
    validations:
      required: true
  - type: textarea
    id: diagnosed-command
    attributes:
      label: Command being diagnosed
      description: Include a sanitized command and relevant options after `--`.
      placeholder: "envbisect diagnose --pass working.env --fail broken.env -- python app.py"
    validations:
      required: true
  - type: dropdown
    id: demo-reproduction
    attributes:
      label: Does this reproduce with the included demo?
      options:
        - "Yes"
        - "No"
        - "Not checked"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and observed behavior
      description: Describe what you expected and what happened.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or output
      description: Remove credentials, tokens, private paths, and sensitive command output.
      render: text
  - type: textarea
    id: environment
    attributes:
      label: Sanitized environment details
      description: Include only relevant variable names and synthetic or redacted values. Never attach original dotenv snapshots containing secrets.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked this report and its attachments for secrets and private data.
          required: true
